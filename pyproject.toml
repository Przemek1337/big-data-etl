[project]
name = "aml-etl"
version = "0.1.0"
description = "AML transactions ETL pipeline with exchange-rate scraping, analytics and a Dash dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aml_etl"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "testcontainers[mongodb]",
    "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PTH", "ERA"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["scripts/tests"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["scripts", "tests"]
testpaths = ["scripts", "tests"]
markers = ["integration: needs Docker"]
