repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src scripts
        language: system
        pass_filenames: false
        types: [python]
      - id: no-comments
        name: no comments or docstrings
        entry: uv run python scripts/check_no_comments.py
        language: system
        types: [python]
